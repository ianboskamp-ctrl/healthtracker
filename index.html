<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; manifest-src 'self'; frame-src https://script.google.com https://*.googleusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HealthTracker">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>HealthTracker</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 17px -apple-system, system-ui, sans-serif; overflow: hidden; }
  @media (prefers-color-scheme: light) { html, body { background: #f2f2f7; color: #000; } }
  iframe { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; border: 0; display: none; }
  #sleutel { display: none; padding: calc(env(safe-area-inset-top) + 40px) 24px 24px; max-width: 420px; margin: 0 auto; }
  #sleutel input { width: 100%; box-sizing: border-box; font-size: 17px; padding: 12px; border-radius: 12px; border: 1px solid #8e8e93; margin: 12px 0; }
  #sleutel button { width: 100%; font-size: 17px; font-weight: 600; padding: 13px; border: 0; border-radius: 12px; background: #0a84ff; color: #fff; }
  p { color: #8e8e93; font-size: 15px; line-height: 1.4; }
</style>
</head>
<body>
<!-- Beginschermpagina voor de HealthTracker-app (Apps Script). Deze pagina stelt de statusbalk in, wat Apps Script zelf niet toelaat,
     en toont de app schermvullend in een iframe. De appsleutel staat NIET in deze (openbare) pagina: die komt uit #k=... in de link
     op het beginscherm (het deel na # wordt nooit naar GitHub verstuurd), of wordt één keer gevraagd en enkel op het toestel bewaard.
     De pagina laadt geen externe scripts en mag enkel de HealthTracker-app van Google insluiten (Content-Security-Policy). -->
<div id="sleutel">
  <h2>HealthTracker</h2>
  <p>Geef één keer je appsleutel in. Die blijft enkel op dit toestel bewaard.</p>
  <input id="k" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="appsleutel">
  <button onclick="bewaar()">Openen</button>
</div>
<iframe id="app" title="HealthTracker" referrerpolicy="no-referrer"></iframe>
<script>
  var EXEC = 'https://script.google.com/macros/s/AKfycbz3t_hk_q5_aivg3KNrg0H-dJUr0fRPdtXGsIeNP-gWmXUYNfFGK5qYP-rAdYZYHt-8/exec';
  function lees() { try { return localStorage.getItem('ht_k') || ''; } catch (e) { return ''; } }
  function zet(k) { try { localStorage.setItem('ht_k', k); } catch (e) {} }
  function toon(k) {
    var f = document.getElementById('app');
    f.src = EXEC + '?p=app&k=' + encodeURIComponent(k);
    f.style.display = 'block';
    document.getElementById('sleutel').style.display = 'none';
  }
  function bewaar() { var k = document.getElementById('k').value.trim(); if (!k) return; zet(k); toon(k); }
  var k = new URLSearchParams(location.hash.slice(1)).get('k') || lees();
  if (k) { zet(k); toon(k); } else document.getElementById('sleutel').style.display = 'block';
</script>
</body>
</html>
