<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: https:; font-src data:; connect-src https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HealthTracker">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>HealthTracker</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #000; color: #fff; font: 17px -apple-system, system-ui, sans-serif; }
  @media (prefers-color-scheme: light) { html, body { background: #f2f2f7; color: #000; } }
  .blok { display: none; padding: calc(env(safe-area-inset-top) + 40px) 24px 24px; max-width: 420px; margin: 0 auto; }
  input { width: 100%; box-sizing: border-box; font-size: 17px; padding: 12px; border-radius: 12px; border: 1px solid #8e8e93; margin: 12px 0; }
  button { width: 100%; font-size: 17px; font-weight: 600; padding: 13px; border: 0; border-radius: 12px; background: #0a84ff; color: #fff; }
  p { color: #8e8e93; font-size: 15px; line-height: 1.4; }
</style>
</head>
<body>
<!-- Beginschermpagina voor de HealthTracker-app. Deze openbare pagina bevat geen gegevens en geen appsleutel.
     Ze haalt de app op bij het eigen Google Apps Script (alleen met de juiste sleutel) en praat er daarna mee via fetch,
     zonder Google-cookies en zonder iframe. De sleutel komt uit #k=... in de link op het beginscherm (het deel na # wordt
     nooit naar GitHub verstuurd) of wordt één keer gevraagd, en blijft enkel op dit toestel bewaard. -->
<div id="laden" class="blok"><h2>HealthTracker</h2><p>Laden&hellip;</p></div>
<div id="sleutel" class="blok">
  <h2>HealthTracker</h2>
  <p id="uitleg">Geef één keer je appsleutel in. Die blijft enkel op dit toestel bewaard.</p>
  <input id="k" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="appsleutel">
  <button onclick="bewaar()">Openen</button>
</div>
<script>
  var EXEC = 'https://script.google.com/macros/s/AKfycbz3t_hk_q5_aivg3KNrg0H-dJUr0fRPdtXGsIeNP-gWmXUYNfFGK5qYP-rAdYZYHt-8/exec';
  function lees() { try { return localStorage.getItem('ht_k') || ''; } catch (e) { return ''; } }
  function zet(k) { try { if (k) localStorage.setItem('ht_k', k); else localStorage.removeItem('ht_k'); } catch (e) {} }
  function toon(id) { ['laden', 'sleutel'].forEach(function (x) { document.getElementById(x).style.display = x === id ? 'block' : 'none'; }); }
  function api(f, a) {
    return fetch(EXEC + '?p=api', { method: 'POST', body: JSON.stringify({ f: f, a: a }), credentials: 'omit', redirect: 'follow' })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (!j.ok) throw new Error(j.fout || 'fout'); return j.r; });
  }
  // Vervangt google.script.run en google.script.url in de app, zodat dezelfde App.html hier werkt.
  // Snelheid: de laatste antwoorden van de leesfuncties staan op het toestel. De app toont die meteen en krijgt
  // daarna het verse antwoord, maar enkel als dat verschilt. Na elke opslag wordt dat geheugen gewist.
  function shim(EXEC, K) {
    var OPSLAG = ['appLaad', 'appLaadReeks', 'appDashboard', 'appFitness'];
    function vandaag() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
    function lees(s) { try { return localStorage.getItem(s); } catch (e) { return null; } }
    function zet(s, v) { try { localStorage.setItem(s, v); } catch (e) { wis(); } }
    function wis() { try { for (var i = localStorage.length - 1; i >= 0; i--) { var k = localStorage.key(i); if (k && k.indexOf('ht_c_') === 0) localStorage.removeItem(k); } } catch (e) {} }
    function api(f, a) {
      var id = f + JSON.stringify(a.slice(1)), pre = window.__HT_PRE && window.__HT_PRE[id];
      if (pre) { delete window.__HT_PRE[id]; return pre; }
      return fetch(EXEC + '?p=api', { method: 'POST', body: JSON.stringify({ f: f, a: a }), credentials: 'omit', redirect: 'follow' })
        .then(function (r) { return r.json(); })
        .then(function (j) { if (!j.ok) throw new Error(j.fout || 'fout'); return j.r; });
    }
    function runner(ok, fail) {
      return new Proxy({}, { get: function (_, naam) {
        if (naam === 'withSuccessHandler') return function (f) { return runner(f, fail); };
        if (naam === 'withFailureHandler') return function (f) { return runner(ok, f); };
        if (naam === 'withUserObject') return function () { return runner(ok, fail); };
        return function () {
          var a = Array.prototype.slice.call(arguments), s = OPSLAG.indexOf(naam) >= 0 ? 'ht_c_' + naam + '_' + JSON.stringify(a.slice(1)) : null, oud = null;
          if (s && ok) {
            oud = lees(s);
            if (oud) {
              var c = null; try { c = JSON.parse(oud); } catch (e) { oud = null; }
              if (naam === 'appLaad' && !a[1] && c && c.datum !== vandaag()) oud = null; // gisteren bewaard: niet tonen
              if (oud) setTimeout(function () { ok(c); }, 0);
            }
          }
          api(naam, a).then(function (r) {
            var t = s ? JSON.stringify(r) : null;
            if (s) zet(s, t);
            if (/^app(Bewaar|Zet|Nieuw|Voeg)/.test(naam)) wis(); // na opslaan: geen oude gegevens meer tonen
            if (ok && (!s || t !== oud)) ok(r);
          }, function (e) { if (fail) fail(e); else console.error(e); });
        };
      } });
    }
    var p = {}; new URLSearchParams(location.hash.slice(1)).forEach(function (v, k) { p[k] = v; }); delete p.k; p.k = K;
    window.google = { script: { run: runner(null, null), url: { getLocation: function (cb) { cb({ parameter: p, hash: '' }); } } } };
    // de app zelf op de achtergrond verversen voor de volgende keer
    setTimeout(function () { api('appBron', [K]).then(function (h) { if (h && h !== lees('ht_bron')) zet('ht_bron', h); }, function () {}); }, 4000);
  }
  function teken(html, k) {
    var s = '<script>(' + shim.toString() + ')(' + JSON.stringify(EXEC) + ',' + JSON.stringify(k) + ');<\/script>';
    // de tags van deze pagina (viewport, statusbalk, icoon, beveiliging) meenemen in de app
    var meta = Array.prototype.map.call(document.querySelectorAll('head meta:not([charset]), head link'), function (e) { return e.outerHTML; }).join('') + '<title>HealthTracker</title>';
    html = html.replace(/<head>/i, function (m) { return m + meta + s; });
    document.open(); document.write(html); document.close();
  }
  function start(k) {
    // gegevens van vandaag al ophalen terwijl de app laadt
    window.__HT_PRE = { 'appLaad[""]': api('appLaad', [k, '']) };
    var bron = null; try { bron = localStorage.getItem('ht_bron'); } catch (e) {}
    if (bron) { teken(bron, k); return; } // app staat al op het toestel: meteen tonen
    toon('laden');
    api('appBron', [k]).then(function (html) {
      zet(k); try { localStorage.setItem('ht_bron', html); } catch (e) {}
      teken(html, k);
    }, function (e) {
      if (/sleutel/.test(e.message)) { zet(''); document.getElementById('uitleg').textContent = 'Die sleutel klopt niet. Probeer opnieuw.'; }
      else document.getElementById('uitleg').textContent = 'Laden lukte niet (' + e.message + '). Controleer je verbinding en probeer opnieuw.';
      toon('sleutel');
    });
  }
  function bewaar() { var k = document.getElementById('k').value.trim(); if (k) start(k); }
  var k0 = new URLSearchParams(location.hash.slice(1)).get('k') || lees();
  if (k0) start(k0); else toon('sleutel');
</script>
</body>
</html>
